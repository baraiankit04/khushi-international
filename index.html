<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- =========================
       FAVICON / WEBSITE LOGO
  ========================== -->
  <link
    rel="icon"
    type="image/png"
    href="/images/khushilogo.png"
  />

  <link
    rel="apple-touch-icon"
    href="/images/khushilogo.png"
  />

  <!-- =========================
       RESPONSIVE
  ========================== -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- =========================
       WEBSITE TITLE
  ========================== -->
  <title>
    Khushi International | Fresh Fruits, Vegetables & Spices Exporter
  </title>

  <!-- =========================
       SEO DESCRIPTION
  ========================== -->
  <meta
    name="description"
    content="Khushi International is a fresh produce exporter based in Navi Mumbai, India, supplying fresh fruits, vegetables and Indian spices for international markets."
  />

  <!-- =========================
       SEO KEYWORDS
  ========================== -->
  <meta
    name="keywords"
    content="Khushi International, fresh fruits exporter, vegetables exporter, Indian spices exporter, fresh produce exporter, fruits exporter India, vegetables exporter India, Navi Mumbai exporter, Vashi exporter"
  />

  <meta
    name="author"
    content="Khushi International"
  />

  <meta
    name="robots"
    content="index, follow"
  />

  <!-- =========================
       THEME COLOR
  ========================== -->
  <meta
    name="theme-color"
    content="#198754"
  />

  <!-- =========================
       OPEN GRAPH
       WhatsApp / Facebook etc.
  ========================== -->
  <meta
    property="og:title"
    content="Khushi International | Fresh Produce Exporter"
  />

  <meta
    property="og:description"
    content="Fresh fruits, vegetables and Indian spices from India for international markets."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:image"
    content="/images/khushilogo.png"
  />

  <meta
    property="og:site_name"
    content="Khushi International"
  />

  <!-- =========================
       TWITTER / X
  ========================== -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Khushi International | Fresh Produce Exporter"
  />

  <meta
    name="twitter:description"
    content="Fresh fruits, vegetables and Indian spices from India for international markets."
  />

  <meta
    name="twitter:image"
    content="/images/khushilogo.png"
  />

</head>

<body>

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx"
  ></script>

</body>

</html>
